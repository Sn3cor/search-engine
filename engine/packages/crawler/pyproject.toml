[project]
name = "crawler"
version = "0.1.0"
description = "Simple wikipedia crawler"
readme = "README.md"
authors = [
    { name = "Sn3cor", email = "jakub.krupa23@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
crawl = "crawler.crawler:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
